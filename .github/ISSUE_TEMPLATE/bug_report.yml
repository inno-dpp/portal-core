name: Bug Report
description: Report something that isn't working correctly
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search existing issues first to avoid duplicates.

        **Do not report security vulnerabilities here** — use [private vulnerability reporting](../security/advisories/new) instead (see SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe what went wrong...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Runtime profile
      description: Which Spring profile were you running?
      options:
        - dev (H2)
        - prod (PostgreSQL)
        - test
        - Docker deployment
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Portal version, release tag, or commit hash.
      placeholder: e.g. 0.4.0-beta.25
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant logs or stack traces. **Remove any secrets, tokens, or internal hostnames before posting.**
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Java version, browser (for UI issues), etc.
      placeholder: |
        - OS: Ubuntu 24.04
        - Java: 17.0.10
        - Browser: Firefox 128
