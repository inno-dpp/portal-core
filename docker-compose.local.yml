# Local full stack: locally built image + PostgreSQL, prod profile.
#
# Prerequisite: cp .env.example .env  (all application settings live there)
# Run:          docker compose -f docker-compose.local.yml up --build
services:
  postgres:
    image: postgres:15-alpine
    container_name: d4c-portal-core-postgres-local
    environment:
      POSTGRES_DB: ${DB_NAME:-portal}
      POSTGRES_USER: ${DB_USERNAME:-portal}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT_EXTERNAL:-5555}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - d4c-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-portal} -d ${DB_NAME:-portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: d4c-portal:local
    container_name: d4c-portal-app-local
    # All application settings (secrets, SPIP, CKAN, mail, branding, ...)
    # come from .env; the block below only pins what is inherent to this
    # stack and always wins over .env values.
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${APP_PORT:-8085}}
      # No OpenTelemetry agent locally
      JAVA_TOOL_OPTIONS: ""
      JAVA_OPTS: "-Xmx1g -Xms512m -Djava.security.egd=file:/dev/./urandom"
    ports:
      - "${APP_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    networks:
      - d4c-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_local_data:
    driver: local
  app_logs:
    driver: local

networks:
  d4c-network:
    driver: bridge
