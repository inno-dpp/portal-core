<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:with="brandName=${branding != null ? branding.brandName : 'Portal'}"
           th:text="(${title} ?: 'Bad Request') + ' - ' + ${brandName}">Bad Request</title>

    <!-- Bootstrap CSS -->
    <link th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/custom.css}" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card mt-5 shadow">
                    <div class="card-header bg-warning text-dark text-center">
                        <h1 class="display-1 mb-0">
                            <i class="fas fa-exclamation-circle"></i>
                        </h1>
                        <h2 class="mb-0">400 - Bad Request</h2>
                    </div>
                    <div class="card-body text-center">
                        <div class="mb-4">
                            <p class="lead" th:text="${message} ?: 'Your request could not be processed due to invalid data.'">
                                Your request could not be processed due to invalid data.
                            </p>
                            <p class="text-muted">
                                Please check your input and try again.
                            </p>

                            <!-- Field-specific errors -->
                            <div th:if="${fieldErrors != null and not #maps.isEmpty(fieldErrors)}" class="alert alert-warning mt-3">
                                <h6><i class="fas fa-info-circle"></i> Validation Errors:</h6>
                                <ul class="mb-0 text-start">
                                    <li th:each="error : ${fieldErrors}" th:text="${error.key + ': ' + error.value}"></li>
                                </ul>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <a th:href="@{/}" class="btn btn-primary">
                                <i class="fas fa-home"></i> Back to Home
                            </a>
                            <button onclick="history.back()" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Go Back
                            </button>
                        </div>
                    </div>
                    <div class="card-footer text-center bg-light">
                        <small class="text-muted">
                            If you continue to experience issues, please contact support.
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
