<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Forgot Password - ' + ${branding.brandName}">Forgot Password - Portal</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{${branding.assets.favicon}}">

    <!-- Google Fonts: Montserrat (headings) + Open Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/custom.css}" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Dynamic Branding CSS Variables -->
    <style th:inline="text">
        :root {
            --primary-color: [[${branding.colors.primary}]];
            --secondary-color: [[${branding.colors.secondary}]];
            --accent-color: [[${branding.colors.accent}]];
            --info-color: [[${branding.colors.info}]];
            --success-color: [[${branding.colors.success}]];
            --warning-color: [[${branding.colors.warning}]];
            --danger-color: [[${branding.colors.danger}]];
            --text-color: [[${branding.colors.text}]];
            --light-text-color: [[${branding.colors.lightText}]];
            --font-family: [[${branding.typography.fontFamily}]];
            --heading-font-family: [[${branding.typography.headingFontFamily}]];
            --navbar-background: [[${branding.navbar.background}]];
            --navbar-text-color: [[${branding.navbar.textColor}]];
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="text-center mb-4">
                <img th:src="@{${branding.assets.logoSmall}}"
                     th:alt="${branding.brandName}"
                     style="max-width: 220px; margin-bottom: 12px;"
                     onerror="this.style.display='none'">
                <h5 class="mb-0" style="color: #fff;">Forgot Password</h5>
                <p class="mb-0">Enter your email to reset your password</p>
            </div>

            <!-- Alerts -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle"></i>
                <span th:text="${error}"></span>
            </div>

            <div th:if="${message}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle"></i>
                <span th:text="${message}"></span>
            </div>

            <!-- Forgot Password Form -->
            <form th:action="@{/forgot-password}" th:object="${forgotPasswordDto}" method="post" class="form">
                <div class="mb-3">
                    <label for="email" class="form-label" style="color: #ccc;">Email Address</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="Enter your email address" required autofocus>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                        Email error
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Send Reset Link
                    </button>
                </div>
            </form>

            <div class="text-center mt-3">
                <small style="color: #ccc;">
                    Remember your password?
                    <a th:href="@{/login}" style="color: var(--accent-color); text-decoration: none;">Back to Login</a>
                </small>
            </div>

            <!-- Demo Disclaimer Footer -->
            <div class="text-center demo-disclaimer" style="white-space: nowrap;">
                <small>
                    <i class="fas fa-info-circle"></i>
                    This is a prototype application for demonstration purposes only.
                </small>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
